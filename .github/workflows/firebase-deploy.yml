name: Firebase Deploy & App Distribution

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'appdistribution'
        type: choice
        options:
          - appdistribution
          - all
          - hosting
      firebase_project:
        description: 'Firebase project ID'
        required: false
        default: 'hexinfinity-sakj'
        type: string
      hosting_target:
        description: 'Firebase Hosting target/site name (prevents overwriting other apps)'
        required: false
        default: 'suitduel'
        type: string
      testers:
        description: 'Testers email list for Firebase App Distribution'
        required: false
        default: 'ajmckenna88@googlemail.com'
        type: string
      release_notes:
        description: 'Release Notes for Testers'
        required: false
        default: 'Suit Duel: 200 v0.1.0 Android APK release.'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Suit Duel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (for Android Build)
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'appdistribution' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK Platform & Accept Licenses
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'appdistribution' }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Engine Tests
        run: npm run test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'appdistribution' }}
        run: npx cap sync android

      - name: Build Android Debug APK
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'appdistribution' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Workflow Artifact
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'appdistribution' }}
        uses: actions/upload-artifact@v4
        with:
          name: suitduel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy to Firebase Hosting
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'hosting' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools@latest deploy --only "hosting:${{ inputs.hosting_target }}" --project "${{ inputs.firebase_project }}" --message "${{ inputs.release_notes }}" --token "$FIREBASE_TOKEN"

      - name: Upload APK to Firebase App Distribution
        if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'appdistribution' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          if [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
            echo "ERROR: Set the FIREBASE_ANDROID_APP_ID repository secret to the Android App ID from Firebase Console (package: com.hexinfinity.suitduel)."
            exit 1
          fi
          npx -y firebase-tools@latest appdistribution:distribute android/app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --testers "${{ inputs.testers }}" \
            --release-notes "${{ inputs.release_notes }}" \
            --project "${{ inputs.firebase_project }}" \
            --token "$FIREBASE_TOKEN"
